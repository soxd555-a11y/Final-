openapi: 3.0.3
info:
  description: CRUD หนังสือ (พร้อมอัปโหลดปก) และหมวดหมู่ (catalog)
  title: Books & Catalogs API
  version: 1.0.0
servers:
- url: http://localhost:3000
tags:
- name: Catalogs
- name: Books
paths:
  /api/catalogs:
    get:
      operationId: apiCatalogsGET
      parameters:
      - explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 100
          type: integer
        style: form
      - description: ส่ง true เพื่อดึงทั้งหมดแบบไม่แบ่งหน้า (ใช้เติม dropdown)
        explode: true
        in: query
        name: all
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_catalogs_get_200_response"
          description: สำเร็จ
      summary: รายการ catalog (ค้นหา + แบ่งหน้า)
      tags:
      - Catalogs
      x-eov-operation-handler: controllers/CatalogsController
    post:
      operationId: apiCatalogsPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
        required: true
      responses:
        "201":
          description: สร้างสำเร็จ
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ข้อมูลไม่ถูกต้อง
        "409":
          description: ชื่อซ้ำ
      summary: เพิ่ม catalog
      tags:
      - Catalogs
      x-eov-operation-handler: controllers/CatalogsController
  /api/catalogs/{id}:
    delete:
      operationId: apiCatalogsIdDELETE
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          description: ลบสำเร็จ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ไม่พบข้อมูล
        "409":
          description: ยังมีหนังสืออยู่ในหมวดนี้
      summary: ลบ catalog (ลบไม่ได้ถ้ายังมีหนังสือ)
      tags:
      - Catalogs
      x-eov-operation-handler: controllers/CatalogsController
    get:
      operationId: apiCatalogsIdGET
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          description: สำเร็จ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ไม่พบข้อมูล
      summary: ดู catalog ตาม id
      tags:
      - Catalogs
      x-eov-operation-handler: controllers/CatalogsController
    put:
      operationId: apiCatalogsIdPUT
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
        required: true
      responses:
        "200":
          description: แก้ไขสำเร็จ
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ข้อมูลไม่ถูกต้อง
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ไม่พบข้อมูล
      summary: แก้ไข catalog
      tags:
      - Catalogs
      x-eov-operation-handler: controllers/CatalogsController
  /api/books:
    get:
      operationId: apiBooksGET
      parameters:
      - description: ค้นหาชื่อ/ผู้แต่ง/ISBN
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: catalog_id
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 100
          type: integer
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: id
          enum:
          - id
          - title
          - price
          - created_at
          type: string
        style: form
      - explode: true
        in: query
        name: order
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_books_get_200_response"
          description: สำเร็จ
      summary: รายการหนังสือ (ค้นหา กรอง เรียง แบ่งหน้า)
      tags:
      - Books
      x-eov-operation-handler: controllers/BooksController
    post:
      operationId: apiBooksPOST
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BookInput"
        required: true
      responses:
        "201":
          description: สร้างสำเร็จ
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ข้อมูลไม่ถูกต้อง
      summary: เพิ่มหนังสือ (อัปโหลดปกได้)
      tags:
      - Books
      x-eov-operation-handler: controllers/BooksController
  /api/books/{id}:
    delete:
      operationId: apiBooksIdDELETE
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          description: ลบสำเร็จ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ไม่พบข้อมูล
      summary: ลบหนังสือ (ลบไฟล์ปกด้วย)
      tags:
      - Books
      x-eov-operation-handler: controllers/BooksController
    get:
      operationId: apiBooksIdGET
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_books__id__get_200_response"
          description: สำเร็จ
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ไม่พบข้อมูล
      summary: ดูหนังสือตาม id
      tags:
      - Books
      x-eov-operation-handler: controllers/BooksController
    put:
      operationId: apiBooksIdPUT
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BookInput"
        required: true
      responses:
        "200":
          description: แก้ไขสำเร็จ
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ข้อมูลไม่ถูกต้อง
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ไม่พบข้อมูล
      summary: แก้ไขหนังสือ (ไม่ส่ง cover = ใช้รูปเดิม)
      tags:
      - Books
      x-eov-operation-handler: controllers/BooksController
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: ข้อมูลไม่ถูกต้อง
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: ไม่พบข้อมูล
  schemas:
    Error:
      example:
        success: false
        message: message
      properties:
        success:
          example: false
          type: boolean
        message:
          type: string
      type: object
    Pagination:
      example:
        page: 1
        limit: 5
        total: 5
        totalPages: 2
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      type: object
    Catalog:
      example:
        id: 0
        name: name
        description: description
        book_count: 6
        created_at: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          nullable: true
          type: string
        book_count:
          type: integer
        created_at:
          format: date-time
          type: string
      type: object
    CatalogInput:
      example:
        name: name
        description: description
      properties:
        name:
          maxLength: 100
          type: string
        description:
          maxLength: 255
          type: string
      required:
      - name
      type: object
    Book:
      example:
        id: 0
        title: title
        author: author
        isbn: isbn
        price: 6.027456183070403
        publish_year: 1
        catalog_id: 5
        catalog_name: catalog_name
        cover: cover
        cover_url: /uploads/1700000000000-ab12cd34.jpg
        created_at: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        isbn:
          nullable: true
          type: string
        price:
          type: number
        publish_year:
          nullable: true
          type: integer
        catalog_id:
          type: integer
        catalog_name:
          type: string
        cover:
          nullable: true
          type: string
        cover_url:
          example: /uploads/1700000000000-ab12cd34.jpg
          nullable: true
          type: string
        created_at:
          format: date-time
          type: string
      type: object
    BookInput:
      properties:
        title:
          maxLength: 255
          type: string
        author:
          type: string
        isbn:
          type: string
        price:
          minimum: 0
          type: number
        publish_year:
          type: integer
        catalog_id:
          type: integer
        cover:
          description: ไฟล์ jpg/png/webp ไม่เกิน 2MB
          format: binary
          type: string
      required:
      - author
      - catalog_id
      - price
      - title
      type: object
    _api_catalogs_get_200_response:
      example:
        success: true
        data:
        - id: 0
          name: name
          description: description
          book_count: 6
          created_at: 2000-01-23T04:56:07.000+00:00
        - id: 0
          name: name
          description: description
          book_count: 6
          created_at: 2000-01-23T04:56:07.000+00:00
        pagination:
          page: 1
          limit: 5
          total: 5
          totalPages: 2
      properties:
        success:
          type: boolean
        data:
          items:
            $ref: "#/components/schemas/Catalog"
          type: array
        pagination:
          $ref: "#/components/schemas/Pagination"
      type: object
    _api_books_get_200_response:
      example:
        success: true
        data:
        - id: 0
          title: title
          author: author
          isbn: isbn
          price: 6.027456183070403
          publish_year: 1
          catalog_id: 5
          catalog_name: catalog_name
          cover: cover
          cover_url: /uploads/1700000000000-ab12cd34.jpg
          created_at: 2000-01-23T04:56:07.000+00:00
        - id: 0
          title: title
          author: author
          isbn: isbn
          price: 6.027456183070403
          publish_year: 1
          catalog_id: 5
          catalog_name: catalog_name
          cover: cover
          cover_url: /uploads/1700000000000-ab12cd34.jpg
          created_at: 2000-01-23T04:56:07.000+00:00
        pagination:
          page: 1
          limit: 5
          total: 5
          totalPages: 2
      properties:
        success:
          type: boolean
        data:
          items:
            $ref: "#/components/schemas/Book"
          type: array
        pagination:
          $ref: "#/components/schemas/Pagination"
      type: object
    _api_books__id__get_200_response:
      example:
        success: true
        data:
          id: 0
          title: title
          author: author
          isbn: isbn
          price: 6.027456183070403
          publish_year: 1
          catalog_id: 5
          catalog_name: catalog_name
          cover: cover
          cover_url: /uploads/1700000000000-ab12cd34.jpg
          created_at: 2000-01-23T04:56:07.000+00:00
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Book"
      type: object
