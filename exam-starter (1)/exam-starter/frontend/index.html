<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการหนังสือ</title>
  <!-- ถ้าอาจารย์ให้ HTML/CSS มา ให้เอาไปแทนไฟล์นี้ แล้วเช็กว่า id ตรงกับที่ js ใช้ (ดู README หัวข้อ "ใช้กับ HTML ของอาจารย์") -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>ระบบจัดการหนังสือ</h1>
    <nav>
      <button class="tab active" data-target="books-section">หนังสือ</button>
      <button class="tab" data-target="catalogs-section">หมวดหมู่ (Catalog)</button>
    </nav>
  </header>

  <main>
    <!-- ===== หนังสือ ===== -->
    <section id="books-section" class="panel">
      <div class="toolbar">
        <input type="search" id="book-search" placeholder="ค้นหาชื่อ / ผู้แต่ง / ISBN">
        <select id="book-filter-catalog"><option value="">ทุกหมวดหมู่</option></select>
        <button id="book-add" class="btn primary">+ เพิ่มหนังสือ</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ปก</th><th>ชื่อหนังสือ</th><th>ผู้แต่ง</th><th>หมวดหมู่</th>
            <th class="num">ราคา</th><th>ปีพิมพ์</th><th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="book-tbody"></tbody>
      </table>
      <div id="book-pagination" class="pagination"></div>
    </section>

    <!-- ===== catalog ===== -->
    <section id="catalogs-section" class="panel hidden">
      <div class="toolbar">
        <input type="search" id="catalog-search" placeholder="ค้นหาหมวดหมู่">
        <button id="catalog-add" class="btn primary">+ เพิ่มหมวดหมู่</button>
      </div>
      <table>
        <thead>
          <tr><th>#</th><th>ชื่อ</th><th>คำอธิบาย</th><th class="num">จำนวนหนังสือ</th><th>จัดการ</th></tr>
        </thead>
        <tbody id="catalog-tbody"></tbody>
      </table>
      <div id="catalog-pagination" class="pagination"></div>
    </section>
  </main>

  <!-- ===== ฟอร์มหนังสือ ===== -->
  <dialog id="book-dialog">
    <form id="book-form" enctype="multipart/form-data">
      <h2 id="book-dialog-title">เพิ่มหนังสือ</h2>
      <input type="hidden" name="id" id="book-id">

      <label>ชื่อหนังสือ *
        <input type="text" name="title" id="book-title" required maxlength="255">
      </label>
      <label>ผู้แต่ง *
        <input type="text" name="author" id="book-author" required>
      </label>
      <label>ISBN
        <input type="text" name="isbn" id="book-isbn" maxlength="20">
      </label>
      <div class="row">
        <label>ราคา *
          <input type="number" name="price" id="book-price" min="0" step="0.01" required>
        </label>
        <label>ปีที่พิมพ์
          <input type="number" name="publish_year" id="book-year" min="1000" max="3000">
        </label>
      </div>
      <label>หมวดหมู่ *
        <select name="catalog_id" id="book-catalog" required></select>
      </label>
      <label>ปกหนังสือ (jpg / png / webp ไม่เกิน 2MB)
        <input type="file" name="cover" id="book-cover" accept="image/jpeg,image/png,image/webp">
      </label>
      <img id="book-cover-preview" class="cover-preview hidden" alt="ตัวอย่างปก">

      <div class="dialog-actions">
        <button type="button" class="btn" id="book-cancel">ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- ===== ฟอร์ม catalog ===== -->
  <dialog id="catalog-dialog">
    <form id="catalog-form">
      <h2 id="catalog-dialog-title">เพิ่มหมวดหมู่</h2>
      <input type="hidden" id="catalog-id">
      <label>ชื่อหมวดหมู่ *
        <input type="text" id="catalog-name" required maxlength="100">
      </label>
      <label>คำอธิบาย
        <input type="text" id="catalog-description" maxlength="255">
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" id="catalog-cancel">ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <!-- ลำดับสำคัญ: api -> ui -> books -> catalogs -> app -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/books.js"></script>
  <script src="js/catalogs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
