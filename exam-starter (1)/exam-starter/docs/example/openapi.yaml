openapi: 3.0.3
info:
  title: Books & Catalogs API
  description: CRUD หนังสือ (พร้อมอัปโหลดปก) และหมวดหมู่ (catalog)
  version: 1.0.0
servers:
  - url: http://localhost:3000
tags:
  - name: Catalogs
  - name: Books

paths:
  /api/catalogs:
    get:
      tags: [Catalogs]
      summary: รายการ catalog (ค้นหา + แบ่งหน้า)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - name: all
          in: query
          description: ส่ง true เพื่อดึงทั้งหมดแบบไม่แบ่งหน้า (ใช้เติม dropdown)
          schema: { type: boolean }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Catalog' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Catalogs]
      summary: เพิ่ม catalog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '201': { description: สร้างสำเร็จ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: ชื่อซ้ำ }

  /api/catalogs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Catalogs]
      summary: ดู catalog ตาม id
      responses:
        '200': { description: สำเร็จ }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalogs]
      summary: แก้ไข catalog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '200': { description: แก้ไขสำเร็จ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Catalogs]
      summary: ลบ catalog (ลบไม่ได้ถ้ายังมีหนังสือ)
      responses:
        '200': { description: ลบสำเร็จ }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: ยังมีหนังสืออยู่ในหมวดนี้ }

  /api/books:
    get:
      tags: [Books]
      summary: รายการหนังสือ (ค้นหา กรอง เรียง แบ่งหน้า)
      parameters:
        - { name: q, in: query, description: ค้นหาชื่อ/ผู้แต่ง/ISBN, schema: { type: string } }
        - { name: catalog_id, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - name: sort
          in: query
          schema: { type: string, enum: [id, title, price, created_at], default: id }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Books]
      summary: เพิ่มหนังสือ (อัปโหลดปกได้)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '201': { description: สร้างสำเร็จ }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/books/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Books]
      summary: ดูหนังสือตาม id
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Books]
      summary: แก้ไขหนังสือ (ไม่ส่ง cover = ใช้รูปเดิม)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '200': { description: แก้ไขสำเร็จ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Books]
      summary: ลบหนังสือ (ลบไฟล์ปกด้วย)
      responses:
        '200': { description: ลบสำเร็จ }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  responses:
    BadRequest:
      description: ข้อมูลไม่ถูกต้อง
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: ไม่พบข้อมูล
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Catalog:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        book_count: { type: integer }
        created_at: { type: string, format: date-time }
    CatalogInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 255 }
    Book:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        author: { type: string }
        isbn: { type: string, nullable: true }
        price: { type: number }
        publish_year: { type: integer, nullable: true }
        catalog_id: { type: integer }
        catalog_name: { type: string }
        cover: { type: string, nullable: true }
        cover_url: { type: string, nullable: true, example: /uploads/1700000000000-ab12cd34.jpg }
        created_at: { type: string, format: date-time }
    BookInput:
      type: object
      required: [title, author, price, catalog_id]
      properties:
        title: { type: string, maxLength: 255 }
        author: { type: string }
        isbn: { type: string }
        price: { type: number, minimum: 0 }
        publish_year: { type: integer }
        catalog_id: { type: integer }
        cover:
          type: string
          format: binary
          description: ไฟล์ jpg/png/webp ไม่เกิน 2MB
